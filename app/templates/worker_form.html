
{% extends "base.html" %}
{% block content %}
{% set editing = worker is not none %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ "Edit Worker" if editing else "New Worker" }}</h2>

    <a href="/ui/workers" class="btn btn-outline-secondary">
        Back
    </a>
</div>

<div class="card p-4">
    <form id="workerForm">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>

                <input id="first_name"
                       class="form-control"
                       maxlength="100"
                       required
                       value="{{ worker.first_name if editing else '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Last Name</label>

                <input id="last_name"
                       class="form-control"
                       maxlength="100"
                       required
                       value="{{ worker.last_name if editing else '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>

                <input id="email"
                       type="email"
                       class="form-control"
                       maxlength="200"
                       required
                       value="{{ worker.email if editing else '' }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone</label>

                <input id="phone"
                       class="form-control"
                       maxlength="30"
                       value="{{ (worker.phone or '') if editing else '' }}">
            </div>
        </div>

        <div id="message"
             class="alert alert-danger mt-3 d-none"></div>

        <div class="d-flex gap-2 mt-4">
            <button id="saveButton"
                    type="submit"
                    class="btn btn-success">
                {{ "Save Changes" if editing else "Create Worker" }}
            </button>

            <a href="/ui/workers"
               class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
document.getElementById("workerForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = document.getElementById("saveButton");
    const message = document.getElementById("message");

    button.disabled = true;
    message.classList.add("d-none");

    const payload = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value
    };

    try {
        const response = await fetch(
            {{ ("/api/workers/" ~ worker.id if editing else "/api/workers") | tojson }},
            {
                method: {{ ("PATCH" if editing else "POST") | tojson }},
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": {{ csrf_token(request) | tojson }}
                },
                body: JSON.stringify(payload)
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof result.detail === "string"
                    ? result.detail
                    : JSON.stringify(result.detail)
            );
        }

        window.location.href = "/ui/workers/" + result.id;

    } catch (error) {
        message.textContent = error.message;
        message.classList.remove("d-none");
        button.disabled = false;
    }
});
</script>

{% endblock %}
