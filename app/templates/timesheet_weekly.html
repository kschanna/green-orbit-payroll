{% extends "base.html" %}

{% block content %}

{% set is_edit = edit_mode | default(false) %}

<div class="container mt-4">

    <h2>
        {{ "Edit Weekly Timesheet" if is_edit else "New Weekly Timesheet" }}
    </h2>

    <p class="text-muted">
        Record hours worked from Monday through Sunday.
    </p>

    <div class="card p-4 mt-4">

        <form id="weeklyTimesheetForm">

            <div class="row mb-4">

                <div class="col-md-6">
                    <label for="engagement_id" class="form-label">
                        Worker / Engagement
                    </label>

                    <select
                        id="engagement_id"
                        class="form-select"
                        required
                        {% if is_edit %}disabled{% endif %}
                    >
                        <option value="">Select worker</option>

                        {% for engagement in engagements %}
                        <option
                            value="{{ engagement.id }}"
                            {% if is_edit and engagement.id == header.engagement_id %}
                                selected
                            {% endif %}
                        >
                            {{ engagement.worker.first_name }}
                            {{ engagement.worker.last_name }}
                            — {{ engagement.organisation.name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6">
                    <label for="week_start" class="form-label">
                        Week Commencing (Monday)
                    </label>

                    <input
                        type="date"
                        id="week_start"
                        class="form-control"
                        required
                        {% if is_edit %}
                            value="{{ header.period_start.isoformat() }}"
                            readonly
                        {% endif %}
                    >
                </div>

            </div>

            <table class="table table-bordered align-middle">

                <thead>
                    <tr>
                        <th>Day</th>
                        <th>Date</th>
                        <th>Assignment</th>
                        <th>Hours Worked</th>
                    </tr>
                </thead>

                <tbody id="weekDays"></tbody>

                <tfoot>
                    <tr>
                        <th colspan="3">Total Weekly Hours</th>
                        <th>
                            <span id="weeklyTotal">0.00</span>
                        </th>
                    </tr>
                </tfoot>

            </table>

            <button type="submit" class="btn btn-primary">
                {{ "Update Weekly Timesheet" if is_edit else "Save Weekly Timesheet" }}
            </button>

            <a href="/ui/timesheets"
               class="btn btn-outline-secondary ms-2">
                Cancel
            </a>

        </form>

        <div id="message" class="mt-3" role="status"></div>

    </div>
</div>

<script>

const editMode = {{ is_edit | tojson }};

const headerId = {% if is_edit %}
    {{ header.id | tojson }}
{% else %}
    null
{% endif %};

const existingEntries = [
    {% if is_edit %}
        {% for entry in entries %}
        {
            work_date: {{ entry.work_date.isoformat() | tojson }},
            hours_worked: {{ entry.hours_worked | float | tojson }},
            assignment_id: {{ entry.assignment_id | tojson }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    {% endif %}
];

const assignmentOptions = [
    {% for assignment in assignments %}
    {
        id: {{ assignment.id | tojson }},
        engagement_id: {{ assignment.engagement_id | tojson }},
        customer_name: {{ assignment.customer.name | tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
];

const days = [
    "Monday", "Tuesday", "Wednesday", "Thursday",
    "Friday", "Saturday", "Sunday"
];

const engagementInput = document.getElementById("engagement_id");
const weekStartInput = document.getElementById("week_start");
const weekDays = document.getElementById("weekDays");
const weeklyTotal = document.getElementById("weeklyTotal");
const message = document.getElementById("message");

function formatDate(date) {
    const year = date.getUTCFullYear();
    const month = String(date.getUTCMonth() + 1).padStart(2, "0");
    const day = String(date.getUTCDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function calculateTotal() {
    const total = [...document.querySelectorAll(".day-hours")]
        .reduce(
            (sum, input) => sum + Number(input.value || 0),
            0
        );

    weeklyTotal.textContent = total.toFixed(2);
}

function populateWeeklyAssignments() {

    const engagementId = Number(engagementInput.value);

    document.querySelectorAll(".day-assignment").forEach(select => {

        const previous = select.value || select.dataset.selected;

        select.innerHTML = '<option value="">Select assignment</option>';

        assignmentOptions
            .filter(a => a.engagement_id === engagementId)
            .forEach(a => {

                const option = document.createElement("option");
                option.value = a.id;
                option.textContent = a.customer_name;

                select.appendChild(option);
            });

        if ([...select.options].some(
            option => option.value === String(previous)
        )) {
            select.value = String(previous);
        }

        const available = [...select.options]
            .filter(option => option.value);

        if (!select.value && available.length === 1) {
            select.value = available[0].value;
        }
    });
}

function renderWeek() {

    const value = weekStartInput.value;

    weekDays.innerHTML = "";
    weeklyTotal.textContent = "0.00";

    if (!value) return;

    const start = new Date(`${value}T00:00:00Z`);

    if (start.getUTCDay() !== 1) {
        message.className = "alert alert-warning mt-3";
        message.textContent = "Please select a Monday.";
        return;
    }

    message.className = "mt-3";
    message.textContent = "";

    days.forEach((day, index) => {

        const current = new Date(start);

        current.setUTCDate(start.getUTCDate() + index);

        const currentDate = formatDate(current);

        const existing = existingEntries.find(
            entry => entry.work_date === currentDate
        );

        const hours = existing
            ? Number(existing.hours_worked).toFixed(2)
            : (index < 5 ? "8.00" : "0.00");

        const selectedAssignment = existing?.assignment_id ?? "";

        weekDays.insertAdjacentHTML(
            "beforeend",
            `
            <tr>
                <td>${day}</td>
                <td>${currentDate}</td>

                <td>
                    <select
                        class="form-select day-assignment"
                        data-date="${currentDate}"
                        data-selected="${selectedAssignment}"
                    >
                        <option value="">Select assignment</option>
                    </select>
                </td>

                <td>
                    <input
                        type="number"
                        class="form-control day-hours"
                        data-date="${currentDate}"
                        min="0"
                        max="24"
                        step="0.01"
                        value="${hours}"
                        required
                    >
                </td>
            </tr>
            `
        );
    });

    populateWeeklyAssignments();
    calculateTotal();
}

weekStartInput.addEventListener("change", renderWeek);

engagementInput.addEventListener(
    "change",
    populateWeeklyAssignments
);

weekDays.addEventListener("input", calculateTotal);

document.getElementById("weeklyTimesheetForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const engagementId = Number(engagementInput.value);

        if (!engagementId) {
            message.className = "alert alert-danger mt-3";
            message.textContent = "Please select a worker engagement.";
            return;
        }

        const entries = [...document.querySelectorAll(".day-hours")]
            .map(input => ({

                work_date: input.dataset.date,

                hours_worked: Number(input.value),

                assignment_id: Number(
                    document.querySelector(
                        `.day-assignment[data-date="${input.dataset.date}"]`
                    )?.value
                ) || null
            }));

        if (entries.length !== 7) {
            message.className = "alert alert-danger mt-3";
            message.textContent = "Please select a valid Monday.";
            return;
        }

        message.className = "text-muted mt-3";
        message.textContent = editMode ? "Updating..." : "Saving...";

        const endpoint = editMode
            ? `/api/timesheets/weekly/${headerId}`
            : "/api/timesheets/weekly";

        try {
            const response = await fetch(endpoint, {

                method: editMode ? "PATCH" : "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": "{{ csrf_token(request) }}"
                },

                body: JSON.stringify({
                    engagement_id: engagementId,
                    week_start: weekStartInput.value,
                    entries: entries
                })
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = "/ui/timesheets";
            } else {
                message.className = "alert alert-danger mt-3";
                message.textContent = JSON.stringify(result.detail);
            }

        } catch (error) {
            message.className = "alert alert-danger mt-3";
            message.textContent = editMode
                ? "Unable to update weekly timesheet."
                : "Unable to save weekly timesheet.";
        }
    });

if (editMode) {
    renderWeek();
}

</script>

{% endblock %}
