{% extends "base.html" %}
{% block content %}
{% set editing = employee is not none %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2>{{ "Edit Employee" if editing else "New Employee" }}</h2>
        <p class="text-muted mb-0">Employee details</p>
    </div>
    <a href="/ui/employees" class="btn btn-outline-secondary">Back</a>
</div>
<div class="card"><div class="card-body p-4">
<form id="recordForm">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="first_name">First Name</label>
            <input class="form-control" id="first_name" maxlength="100" required
                   value="{{ employee.first_name if editing else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="last_name">Last Name</label>
            <input class="form-control" id="last_name" maxlength="100" required
                   value="{{ employee.last_name if editing else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" maxlength="200" required
                   value="{{ employee.email if editing else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="organisation_id">Organisation</label>
            <select class="form-select" id="organisation_id" required>
                <option value="">Select organisation</option>
                {% for org in organisations %}
                <option value="{{ org.id }}"
                    {% if editing and employee.organisation_id == org.id %}selected{% endif %}>
                    {{ org.name }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div id="formMessage" class="alert mt-3 d-none" role="alert"></div>
    <div class="d-flex gap-2 mt-4">
        <button class="btn btn-success" id="saveButton" type="submit">
            {{ "Save Changes" if editing else "Create Employee" }}
        </button>
        <a href="/ui/employees" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
</div></div>
<script>
document.getElementById("recordForm").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("saveButton");
    const message = document.getElementById("formMessage");
    button.disabled = true;
    message.classList.add("d-none");
    try {
        const response = await fetch(
            {{ ("/api/employees/" ~ employee.id if editing else "/api/employees") | tojson }},
            {
                method: {{ ("PATCH" if editing else "POST") | tojson }},
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": {{ csrf_token(request) | tojson }}
                },
                body: JSON.stringify({
                    first_name: document.getElementById("first_name").value,
                    last_name: document.getElementById("last_name").value,
                    email: document.getElementById("email").value,
                    organisation_id: Number(document.getElementById("organisation_id").value)
                })
            }
        );
        const result = await response.json();
        if (!response.ok) {
            throw new Error(typeof result.detail === "string"
                ? result.detail : JSON.stringify(result.detail));
        }
        window.location.href = "/ui/employees/" + result.id;
    } catch (error) {
        message.textContent = error.message;
        message.className = "alert alert-danger mt-3";
        button.disabled = false;
    }
});
</script>
{% endblock %}
