{% extends "portal_base.html" %}
{% block title %}Set Password{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 560px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3">Choose a new password</h1>
            <p class="text-muted">Your temporary password can only be used to reach this page.</p>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form action="/portal/change-password" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New password</label>
                    <input id="new_password" name="new_password" type="password" class="form-control" minlength="12" autocomplete="new-password" required>
                    <div class="form-text">Use at least 12 characters.</div>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm new password</label>
                    <input id="confirm_password" name="confirm_password" type="password" class="form-control" minlength="12" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Save password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
