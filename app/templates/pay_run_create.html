{% extends "base.html" %}

{% block content %}

<a href="/ui/pay-runs" class="btn btn-link mb-3">
    ← Back to Pay Runs
</a>

<h2>Create Pay Run</h2>
<p class="text-muted">Set up a new payroll processing period.</p>

<div class="card p-3 p-md-4 mt-4" style="max-width: 700px;">

    <form id="payRunForm">

        <!-- Organisation -->
        <div class="mb-4">
            <label for="organisation_id" class="form-label fw-semibold">
                Organisation
            </label>

            <select id="organisation_id"
                    class="form-select"
                    required>
                {% for organisation in organisations %}
                <option value="{{ organisation.id }}">
                    {{ organisation.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Pay period dates -->
        <div class="row g-3 mb-3">

            <div class="col-12 col-md-6">
                <label for="period_start" class="form-label fw-semibold">
                    Pay Period Start
                </label>

                <input type="date"
                       id="period_start"
                       class="form-control"
                       required>
            </div>

            <div class="col-12 col-md-6">
                <label for="period_end" class="form-label fw-semibold">
                    Pay Period End
                </label>

                <input type="date"
                       id="period_end"
                       class="form-control"
                       required>
            </div>

        </div>

        <!-- Payment date -->
        <div class="mb-4">
            <label for="payment_date" class="form-label fw-semibold">
                Payment Date
            </label>

            <input type="date"
                   id="payment_date"
                   class="form-control"
                   required>
        </div>

        <!-- Error message -->
        <div id="formError"
             class="alert alert-danger d-none"
             role="alert"></div>

        <!-- Submit button -->
        <div class="d-grid d-md-block">
            <button type="submit" class="btn btn-success px-4">
                Create Pay Run
            </button>
        </div>

    </form>

</div>

<script>
document.getElementById("payRunForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const errorBox = document.getElementById("formError");
        errorBox.classList.add("d-none");

        const data = {
            organisation_id: Number(
                document.getElementById("organisation_id").value
            ),
            period_start: document.getElementById("period_start").value,
            period_end: document.getElementById("period_end").value,
            payment_date: document.getElementById("payment_date").value
        };

        try {
            const response = await fetch("/pay-runs", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                errorBox.textContent =
                    typeof result.detail === "string"
                        ? result.detail
                        : "Unable to create pay run.";

                errorBox.classList.remove("d-none");
                return;
            }

            window.location.href = `/ui/pay-runs/${result.id}`;

        } catch (error) {
            errorBox.textContent =
                "Unable to connect to the payroll server.";

            errorBox.classList.remove("d-none");
        }
    }
);
</script>

{% endblock %}
