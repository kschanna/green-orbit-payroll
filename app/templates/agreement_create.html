{% extends "base.html" %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
        <h2>New Employment Agreement</h2>
        <p class="text-muted mb-0">
            {{ employee.first_name }} {{ employee.last_name }}
        </p>
    </div>

    <a href="/ui/employees/{{ employee.id }}"
       class="btn btn-outline-secondary">
        Cancel
    </a>
</div>

<div class="card">
    <div class="card-body p-4">

        <form id="agreementForm">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label" for="employment_type">
                        Employment Type
                    </label>
                    <select id="employment_type" class="form-select" required>
                        <option value="full_time">Full Time</option>
                        <option value="part_time">Part Time</option>
                        <option value="casual">Casual</option>
                        <option value="fixed_term">Fixed Term</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="pay_basis">
                        Pay Basis
                    </label>
                    <select id="pay_basis" class="form-select" required>
                        <option value="hourly">Hourly</option>
                        <option value="salary">Salary</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="hourly_rate">
                        Hourly Rate ($)
                    </label>
                    <input id="hourly_rate" type="number"
                           class="form-control"
                           min="0.01" step="0.01" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="ordinary_hours_per_week">
                        Ordinary Hours Per Week
                    </label>
                    <input id="ordinary_hours_per_week" type="number"
                           class="form-control"
                           min="0.01" max="168" step="0.01"
                           value="38" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="pay_frequency">
                        Pay Frequency
                    </label>
                    <select id="pay_frequency" class="form-select" required>
                        <option value="weekly">Weekly</option>
                        <option value="fortnightly">Fortnightly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="start_date">
                        Start Date
                    </label>
                    <input id="start_date" type="date"
                           class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="end_date">
                        End Date (Optional)
                    </label>
                    <input id="end_date" type="date"
                           class="form-control">
                </div>

            </div>

            <div id="formMessage"
                 class="alert alert-danger mt-3 d-none"
                 role="alert"></div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit"
                        id="saveButton"
                        class="btn btn-success">
                    Create Agreement
                </button>

                <a href="/ui/employees/{{ employee.id }}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

<script>
document.getElementById("agreementForm").addEventListener(
    "submit",
    async function(event) {
        event.preventDefault();

        const button = document.getElementById("saveButton");
        const message = document.getElementById("formMessage");

        button.disabled = true;
        message.classList.add("d-none");

        const startDate = document.getElementById("start_date").value;
        const endDate = document.getElementById("end_date").value;

        if (endDate && endDate < startDate) {
            message.textContent = "End date cannot be before start date.";
            message.classList.remove("d-none");
            button.disabled = false;
            return;
        }

        const payload = {
            employment_type: document.getElementById("employment_type").value,
            pay_basis: document.getElementById("pay_basis").value,
            hourly_rate: document.getElementById("hourly_rate").value,
            ordinary_hours_per_week:
                document.getElementById("ordinary_hours_per_week").value,
            pay_frequency: document.getElementById("pay_frequency").value,
            start_date: startDate,
            end_date: endDate || null
        };

        try {
            const response = await fetch(
                "/api/employees/{{ employee.id }}/agreements",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-Token": {{ csrf_token(request) | tojson }}
                    },
                    body: JSON.stringify(payload)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    typeof result.detail === "string"
                        ? result.detail
                        : JSON.stringify(result.detail)
                );
            }

            window.location.href = "/ui/agreements/" + result.id;

        } catch (error) {
            message.textContent = error.message;
            message.classList.remove("d-none");
            button.disabled = false;
        }
    }
);
</script>

{% endblock %}
