<div class="modal fade" id="portalPreviewModal" tabindex="-1" aria-labelledby="portalPreviewTitle" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-md-down"><div class="modal-content"><div class="modal-header"><h2 id="portalPreviewTitle" class="modal-title fs-5">Preview</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body p-0" style="height:min(82vh,900px)"><div id="portalPreviewLoading" class="h-100 d-flex align-items-center justify-content-center text-muted">Loading preview…</div><iframe id="portalPreviewFrame" class="w-100 h-100 border-0 d-none" title="Document preview"></iframe></div></div></div></div>
<script>window.addEventListener('DOMContentLoaded',()=>{const element=document.getElementById('portalPreviewModal'),modal=bootstrap.Modal.getOrCreateInstance(element),frame=document.getElementById('portalPreviewFrame'),loading=document.getElementById('portalPreviewLoading');document.querySelectorAll('.portal-preview').forEach(button=>button.addEventListener('click',()=>{document.getElementById('portalPreviewTitle').textContent=button.dataset.title;loading.classList.remove('d-none');frame.classList.add('d-none');frame.src=button.dataset.url;modal.show();}));frame.addEventListener('load',()=>{loading.classList.add('d-none');frame.classList.remove('d-none');});element.addEventListener('hidden.bs.modal',()=>{frame.src='about:blank';});});</script>
