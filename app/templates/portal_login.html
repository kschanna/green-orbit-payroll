<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worker Portal · Green Orbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card shadow-sm border-0 w-100" style="max-width: 430px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="fs-2 mb-2">🌿</div>
                    <h1 class="h3">Worker Portal</h1>
                    <p class="text-muted mb-0">Sign in with your worker email address.</p>
                </div>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form action="/portal/login" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>
                <div class="text-center mt-4 small"><a href="/login">Administrator sign in</a></div>
            </div>
        </div>
    </main>
    <script src="/static/js/ui_feedback.js"></script>
</body>
</html>
