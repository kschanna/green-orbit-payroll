{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row">

        <div class="col-12 col-md-8 col-lg-6">

    <h2>{{ "Edit Timesheet" if timesheet else "New Timesheet" }}</h2>
    <p class="text-muted">Record hours worked by an employee.</p>

    <form id="timesheetForm" class="mt-4">

        <div class="mb-3">
            <label for="employee_id" class="form-label">Employee</label>

            <select id="employee_id" class="form-select" required>
                <option value="">Select employee</option>

                {% for employee in employees %}
                <!--<option value="{{ employee.id }}">
                    {{ employee.first_name }} {{ employee.last_name }}
                </option>-->
                <option value="{{ employee.id }}"
                    {% if timesheet and timesheet.employee_id == employee.id %}selected{% endif %}>
                    {{ employee.first_name }} {{ employee.last_name }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label for="work_date" class="form-label">Work Date</label>

            <input
                type="date"
                id="work_date"
                class="form-control"
                value="{{ timesheet.work_date if timesheet else '' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="hours_worked" class="form-label">Hours Worked</label>

            <input
                type="number"
                id="hours_worked"
                class="form-control"
                min="0"
                max="24"
                step="0.01"
                placeholder="e.g. 7.5"
                value="{{ timesheet.hours_worked if timesheet else '' }}"
                required
            >

            <div class="form-text">
                Enter hours between 0 and 24.
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Timesheet
        </button>
        <a href="/ui/timesheets" class="btn btn-outline-secondary ms-2">
            Cancel
        </a>
    </form>

    <div id="message" class="mt-3" role="status"></div>
</div>
    </div>
</div>

<script>
document.getElementById("timesheetForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");
    message.textContent = "Saving...";

    try {
        const timesheetId = {{ timesheet.id if timesheet else 'null' }};

        const response = await fetch(
            timesheetId ? `/api/timesheets/${timesheetId}` : "/api/timesheets",
            {
                method: timesheetId ? "PATCH" : "POST",
                headers: {
                "Content-Type": "application/json",
                "X-CSRF-Token": "{{ csrf_token(request) }}"
            },
            body: JSON.stringify({
                employee_id: Number(document.getElementById("employee_id").value),
                work_date: document.getElementById("work_date").value,
                hours_worked: Number(document.getElementById("hours_worked").value)
            })
        });

        const result = await response.json();

        if (response.ok) {
            message.className = "alert alert-success mt-3";
            message.textContent = "Timesheet saved successfully! ID: " + result.id;
            //document.getElementById("hours_worked").value = "";
            if (!timesheetId) {
                document.getElementById("hours_worked").value = "";
            }
        } else {
            message.className = "alert alert-danger mt-3";
            message.textContent = "Unable to save timesheet: " + JSON.stringify(result.detail);
        }

    } catch (error) {
        message.className = "alert alert-danger mt-3";
        message.textContent = "An error occurred while saving the timesheet.";
    }
});
</script>

{% endblock %}
