{% if pagination and pagination.total %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3">
  <div class="text-muted small">
    Showing {{ pagination.start }}–{{ pagination.end }} of {{ pagination.total }}
  </div>
  <div class="d-flex flex-wrap align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <label class="small text-muted text-nowrap" for="paginationPageSize">Rows per page</label>
      <select id="paginationPageSize"
              class="form-select form-select-sm pagination-page-size"
              aria-label="Rows per page"
              onchange="window.location.href=this.value">
      {% for size, url in pagination.size_urls %}
        <option value="{{ url }}"{% if size == pagination.page_size %} selected{% endif %}>{{ size }}</option>
      {% endfor %}
      </select>
    </div>
    <nav aria-label="Pagination">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item {% if not pagination.previous_url %}disabled{% endif %}">
          <a class="page-link" href="{{ pagination.previous_url or '#' }}" aria-label="Previous">Previous</a>
        </li>
        {% for number, url in pagination.page_urls %}
        <li class="page-item {% if number == pagination.page %}active{% endif %}">
          <a class="page-link" href="{{ url }}">{{ number }}</a>
        </li>
        {% endfor %}
        <li class="page-item {% if not pagination.next_url %}disabled{% endif %}">
          <a class="page-link" href="{{ pagination.next_url or '#' }}" aria-label="Next">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
{% endif %}
