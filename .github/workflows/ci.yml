name: Green Orbit CI

concurrency:
  group: green-orbit-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: green_orbit_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare test database
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: green_orbit_payroll_test
        run: |
          psql -c "CREATE ROLE green_orbit_app WITH LOGIN PASSWORD 'test_password';"
          DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/green_orbit_payroll_test" alembic upgrade head
          psql -c "GRANT ALL ON SCHEMA public TO green_orbit_app;"
          psql -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO green_orbit_app;"
          psql -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO green_orbit_app;"


      - name: Run automated tests
        env:
          DATABASE_URL: postgresql+psycopg://green_orbit_app:test_password@localhost:5432/green_orbit_payroll_test
          SESSION_SECRET: github-actions-test-secret-not-for-production
          SESSION_COOKIE_SECURE: "false"
        run: python -m pytest -v


  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: green-orbit-payroll-demo
      REGION: australia-southeast2
      REPOSITORY: green-orbit-payroll
      SERVICE: green-orbit-payroll
      DOCUMENT_LISTENER_SERVICE: green-orbit-document-listener
      MIGRATION_JOB: green-orbit-payroll-migrate
      CLOUD_SQL_CONNECTION_NAME: green-orbit-payroll-demo:australia-southeast2:green-orbit-postgres
      RUNTIME_SERVICE_ACCOUNT: green-orbit-app@green-orbit-payroll-demo.iam.gserviceaccount.com
      DOCUMENT_BUCKET: green-orbit-payroll-demo-dev-worker-documents
      DOCUMENT_AI_LOCATION: australia-southeast1
      DOCUMENT_AI_PROCESSOR_ID: ${{ vars.DOCUMENT_AI_PROCESSOR_ID }}
      DOCUMENT_PROCESSING_SUBSCRIPTION: green-orbit-dev-document-processing-local
      GEMINI_MODEL: gemini-3.8-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/466984655179/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'green-orbit-deployer@green-orbit-payroll-demo.iam.gserviceaccount.com'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker australia-southeast2-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }}

      - name: Deploy migration job
        run: |
          gcloud run jobs deploy $MIGRATION_JOB \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }} \
            --service-account=$RUNTIME_SERVICE_ACCOUNT \
            --set-cloudsql-instances=$CLOUD_SQL_CONNECTION_NAME \
            --set-env-vars=CLOUD_SQL_CONNECTION_NAME=$CLOUD_SQL_CONNECTION_NAME,DB_USER=green_orbit_app,DB_NAME=green_orbit_payroll \
            --set-secrets=DB_PASSWORD=green-orbit-db-password:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet

      - name: Apply database migrations
        run: |
          gcloud run jobs execute $MIGRATION_JOB \
            --project=$PROJECT_ID \
            --region=$REGION \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }} \
            --service-account=$RUNTIME_SERVICE_ACCOUNT \
            --add-cloudsql-instances=$CLOUD_SQL_CONNECTION_NAME \
            --set-env-vars=CLOUD_SQL_CONNECTION_NAME=$CLOUD_SQL_CONNECTION_NAME,DB_USER=green_orbit_app,DB_NAME=green_orbit_payroll,SESSION_COOKIE_SECURE=true,GEMINI_MODEL=$GEMINI_MODEL,DOCUMENT_BUCKET=$DOCUMENT_BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DOCUMENT_AI_LOCATION=$DOCUMENT_AI_LOCATION,DOCUMENT_AI_PROCESSOR_ID=$DOCUMENT_AI_PROCESSOR_ID \
            --set-secrets=DB_PASSWORD=green-orbit-db-password:latest,SESSION_SECRET=green-orbit-session-secret:latest,GREEN_ORBIT_TFN_KEY=green-orbit-tfn-key:latest,GEMINI_API_KEY=green-orbit-gemini-api-key:latest \
            --allow-unauthenticated \
            --execution-environment=gen2 \
            --memory=1Gi \
            --cpu=1 \
            --concurrency=40 \
            --timeout=300 \
            --min=0 \
            --max=10 \
            --quiet

      - name: Deploy document listener to Cloud Run
        run: |
          gcloud run deploy $DOCUMENT_LISTENER_SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }} \
            --service-account=$RUNTIME_SERVICE_ACCOUNT \
            --add-cloudsql-instances=$CLOUD_SQL_CONNECTION_NAME \
            --set-env-vars=CLOUD_SQL_CONNECTION_NAME=$CLOUD_SQL_CONNECTION_NAME,DB_USER=green_orbit_app,DB_NAME=green_orbit_payroll,DOCUMENT_BUCKET=$DOCUMENT_BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DOCUMENT_AI_LOCATION=$DOCUMENT_AI_LOCATION,DOCUMENT_AI_PROCESSOR_ID=$DOCUMENT_AI_PROCESSOR_ID,DOCUMENT_PROCESSING_SUBSCRIPTION=$DOCUMENT_PROCESSING_SUBSCRIPTION \
            --set-secrets=DB_PASSWORD=green-orbit-db-password:latest \
            --command=uvicorn \
            --args=app.document_listener_service:app,--host,0.0.0.0,--port,8080 \
            --no-allow-unauthenticated \
            --execution-environment=gen2 \
            --no-cpu-throttling \
            --min=1 \
            --max=1 \
            --memory=1Gi \
            --timeout=300 \
            --quiet

      - name: Verify deployed service health
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --format='value(status.url)')
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$SERVICE_URL/health"

      - name: Verify Gemini secret binding
        run: |
          gcloud run services describe $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --format='value(spec.template.spec.containers[0].env.name)' \
            | grep -q GEMINI_API_KEY
