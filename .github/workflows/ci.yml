name: Green Orbit CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: green_orbit_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare test database
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: green_orbit_payroll_test
        run: |
          psql -c "CREATE ROLE green_orbit_app WITH LOGIN PASSWORD 'test_password';"
          DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/green_orbit_payroll_test" alembic upgrade head
          psql -c "GRANT ALL ON SCHEMA public TO green_orbit_app;"
          psql -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO green_orbit_app;"
          psql -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO green_orbit_app;"


      - name: Run automated tests
        env:
          DATABASE_URL: postgresql+psycopg://green_orbit_app:test_password@localhost:5432/green_orbit_payroll_test
          SESSION_SECRET: github-actions-test-secret-not-for-production
          SESSION_COOKIE_SECURE: "false"
        run: python -m pytest -v


  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/466984655179/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'green-orbit-deployer@green-orbit-payroll-demo.iam.gserviceaccount.com'

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker australia-southeast2-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t australia-southeast2-docker.pkg.dev/green-orbit-payroll-demo/green-orbit-payroll/app:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push australia-southeast2-docker.pkg.dev/green-orbit-payroll-demo/green-orbit-payroll/app:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: ${{ false }} # TEMPORARILY DISABLED
        run: |
          gcloud run deploy green-orbit-payroll \
            --project=green-orbit-payroll-demo \
            --region=australia-southeast2 \
            --image=australia-southeast2-docker.pkg.dev/green-orbit-payroll-demo/green-orbit-payroll/app:${{ github.sha }} \
            --quiet